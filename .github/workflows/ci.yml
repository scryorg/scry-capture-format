name: CI

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

# This repo is public: CI runs on GitHub-hosted ubuntu-latest, not Scry's self-hosted runner pool.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run typecheck --workspace packages/scf

      - run: npm run lint

      - run: npm run build --workspace packages/scf

      - run: npm run test --workspace packages/scf
